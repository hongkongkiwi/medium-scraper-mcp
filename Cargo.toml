[package]
name = "medium-scraper-mcp"
version = "2.1.0"
edition = "2021"
rust-version = "1.80"
description = "MCP server: Medium search, article-to-markdown with paywall-aware fetching, batch web crawling with browser fallback, and multi-engine web search"
license = "MIT"
repository = "https://github.com/hongkongkiwi/medium-scraper-mcp"
readme = "README.md"
keywords = ["mcp", "medium", "scraper", "markdown", "crawl"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "medium-scraper-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.9", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "cookies",
    "json",
    "socks",
] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
url = "2"
rand = "0.8"
dirs = "5"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
which = "7"
chromiumoxide = "0.9"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = "0.7"

[dev-dependencies]
rmcp = { version = "3.9", features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
